[package]
name = "t3claw_oauth"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Shared OAuth callback server, landing pages, and host-binding utilities used by every T3Claw OAuth flow"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Terminal-3/t3-claw"
repository = "https://github.com/Terminal-3/t3-claw"
publish = false

[package.metadata.dist]
dist = false

[dependencies]
t3claw_common = { path = "../t3claw_common", version = "0.4.1" }

thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "time", "macros", "rt"] }
urlencoding = "2"
