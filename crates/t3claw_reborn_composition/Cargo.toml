[package]
name = "t3claw_reborn_composition"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Facade-shaped production composition root for T3Claw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Terminal-3/t3-claw"
repository = "https://github.com/Terminal-3/t3-claw"
publish = false

[features]
default = []
# Wire a host-managed LLM model gateway into the assembled runtime via
# t3claw_reborn's `LlmProviderModelGateway`. Off by default so this crate
# stays substrate-only when callers don't want a model gateway in the
# composed runtime. Mirrors `t3claw_reborn`'s own `root-llm-provider`
# feature shape (optional dep, `default-features = false`).
root-llm-provider = [
    "dep:t3claw_llm",
    "t3claw_llm/registry-provider-factory",
    "t3claw_reborn/root-llm-provider",
]
# Expose test-only helpers (mock LLM gateway, budget runtime accessors)
# so integration tests in this crate's `tests/` directory and downstream
# crates can drive `build_reborn_runtime` with a stub model gateway
# (via `RebornRuntimeInput::with_model_gateway_override`) and inspect the
# budget pipeline end-to-end. Enable with `cargo test --features
# test-support` (plus whatever feature surface the test crate also
# requires, e.g. `webui-v2-beta`).
test-support = []
# Compose the Reborn WebChat v2 HTTP gateway in this crate. Off by
# default; turning this on pulls in the v2 route crate plus the axum /
# tower-http middleware stack used by the `webui_serve` module. The
# standalone `t3claw-reborn` binary opts in to call `serve_webui_v2`
# from its `serve` subcommand. Substrate-only callers (v1 `AppBuilder`,
# diagnostic harnesses) stay off the feature and carry no WebUI code.
webui-v2-beta = [
    "dep:t3claw_webui_v2",
    "t3claw_webui_v2/webui-v2-beta",
    "dep:t3claw_webui_v2_static",
    "t3claw_webui_v2_static/webui-v2-beta",
    "dep:t3claw_reborn_identity",
    "t3claw_reborn/webui-user-store",
    "libsql",
    "dep:axum",
    "dep:tower",
    "dep:tower-http",
    "dep:lru",
]
# Host-mounted Slack Events API ingress fragment for the Reborn ProductAdapter
# MVP. Off by default; host binaries opt in and mount it behind their Slack
# enablement/config checks.
slack-v2-host-beta = [
    "webui-v2-beta",
    "dep:t3claw_slack_v2_adapter",
    "dep:t3claw_wasm_product_adapters",
    "dep:t3claw_product_workflow_storage",
]
openai-compat-beta = [
    "webui-v2-beta",
    "dep:t3claw_reborn_openai_compat",
    "t3claw_reborn_openai_compat/openai-compat-beta",
    "dep:t3claw_reborn_openai_compat_storage",
    "dep:t3claw_product_workflow_storage",
    "t3claw_product_workflow_storage/libsql",
    "t3claw_reborn_openai_compat_storage/libsql",
    "t3claw_product_adapters/host-auth-mint",
]
libsql = [
    "dep:libsql",
    "t3claw_filesystem/libsql",
    "t3claw_host_runtime/libsql",
    "t3claw_reborn/filesystem-goal-store",
    "t3claw_reborn_event_store/libsql",
    "t3claw_resources/libsql",
    "t3claw_run_state/libsql",
    "t3claw_triggers/libsql",
]
postgres = [
    "dep:deadpool-postgres",
    "t3claw_filesystem/postgres",
    "t3claw_host_runtime/postgres",
    "t3claw_reborn/filesystem-goal-store",
    "t3claw_reborn_event_store/postgres",
    "t3claw_resources/postgres",
    "t3claw_run_state/postgres",
    "t3claw_triggers/postgres",
]
[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
deadpool-postgres = { version = "0.14", optional = true }
futures = "0.3"
t3claw_auth = { path = "../t3claw_auth" }
t3claw_common = { path = "../t3claw_common" }
t3claw_capabilities = { path = "../t3claw_capabilities" }
t3claw_approvals = { path = "../t3claw_approvals" }
t3claw_authorization = { path = "../t3claw_authorization" }
t3claw_conversations = { path = "../t3claw_conversations" }
t3claw_event_projections = { path = "../t3claw_event_projections" }
t3claw_event_streams = { path = "../t3claw_event_streams" }
t3claw_events = { path = "../t3claw_events" }
t3claw_extensions = { path = "../t3claw_extensions" }
t3claw_filesystem = { path = "../t3claw_filesystem" }
t3claw_first_party_extensions = { path = "../t3claw_first_party_extensions" }
t3claw_hooks = { path = "../t3claw_hooks" }
t3claw_host_api = { path = "../t3claw_host_api" }
t3claw_host_runtime = { path = "../t3claw_host_runtime" }
t3claw_llm = { path = "../t3claw_llm", optional = true, default-features = false }
t3claw_loop_support = { path = "../t3claw_loop_support" }
t3claw_mcp = { path = "../t3claw_mcp" }
t3claw_network = { path = "../t3claw_network" }
t3claw_outbound = { path = "../t3claw_outbound" }
t3claw_processes = { path = "../t3claw_processes" }
t3claw_product_adapters = { path = "../t3claw_product_adapters" }
t3claw_product_workflow = { path = "../t3claw_product_workflow" }
t3claw_product_workflow_storage = { path = "../t3claw_product_workflow_storage", optional = true }
t3claw_reborn = { path = "../t3claw_reborn" }
t3claw_reborn_config = { path = "../t3claw_reborn_config" }
t3claw_reborn_identity = { path = "../t3claw_reborn_identity", optional = true }
t3claw_reborn_event_store = { path = "../t3claw_reborn_event_store" }
t3claw_reborn_openai_compat = { path = "../t3claw_reborn_openai_compat", optional = true }
t3claw_reborn_openai_compat_storage = { path = "../t3claw_reborn_openai_compat_storage", optional = true }
t3claw_first_party_extension_ports = { path = "../t3claw_first_party_extension_ports" }
t3claw_resources = { path = "../t3claw_resources" }
t3claw_run_state = { path = "../t3claw_run_state" }
t3claw_runtime_policy = { path = "../t3claw_runtime_policy" }
t3claw_safety = { path = "../t3claw_safety" }
t3claw_secrets = { path = "../t3claw_secrets" }
t3claw_skills = { path = "../t3claw_skills" }
t3claw_slack_v2_adapter = { path = "../t3claw_slack_v2_adapter", optional = true }
t3claw_threads = { path = "../t3claw_threads" }
t3claw_triggers = { path = "../t3claw_triggers" }
t3claw_trust = { path = "../t3claw_trust" }
t3claw_turns = { path = "../t3claw_turns" }
# WebUI v2 route surface — feature-gated; only used by `webui_serve`.
t3claw_webui_v2 = { path = "../t3claw_webui_v2", optional = true }
# WebUI v2 static SPA bundle — feature-gated; mounted under `/v2`.
t3claw_webui_v2_static = { path = "../t3claw_webui_v2_static", optional = true }
t3claw_wasm_product_adapters = { path = "../t3claw_wasm_product_adapters", optional = true }
libsql = { version = "0.6", optional = true, default-features = false, features = ["core", "replication", "remote", "tls"] }
# axum + tower middleware stack used by the `webui_serve` module. Each
# entry is feature-gated so non-beta builds carry no HTTP surface code.
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors", "set-header", "limit", "catch-panic"] }
lru = { version = "0.16", optional = true }
fs4 = "0.6"
rand = "0.8"
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
t3claw_common = { path = "../t3claw_common" }
t3claw_host_api = { path = "../t3claw_host_api" }
t3claw_host_runtime = { path = "../t3claw_host_runtime", features = ["test-support"] }
t3claw_conversations = { path = "../t3claw_conversations" }
t3claw_reborn_composition = { path = ".", features = ["test-support"] }
t3claw_threads = { path = "../t3claw_threads" }
t3claw_turns = { path = "../t3claw_turns" }
t3claw_product_workflow = { path = "../t3claw_product_workflow", features = ["test-support"] }
t3claw_product_adapters = { path = "../t3claw_product_adapters" }
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
rust_decimal_macros = "1"
sha2 = "0.10"
tempfile = "3"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "time"] }
# Real WebSocket client for the v2 stream-events-ws caller-level test.
# Oneshot via `tower::ServiceExt::oneshot` cannot complete a true WS
# upgrade (no underlying TCP stream → axum's WebSocketUpgrade extractor
# returns 426), so the happy-path test needs a bound listener and a
# proper WS client.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tower = { version = "0.5", features = ["util"] }
tracing-test = "0.2"

[build-dependencies]
t3claw_skills = { path = "../t3claw_skills" }
serde_json = "1"

[lints]
workspace = true
