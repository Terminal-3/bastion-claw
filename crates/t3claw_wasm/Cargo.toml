[package]
name = "t3claw_wasm"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
t3claw_host_api = { path = "../t3claw_host_api" }
t3claw_wasm_limiter = { path = "../t3claw_wasm_limiter" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tracing = "0.1"
wasmtime = { version = "44.0.2", features = ["component-model"] }
wasmtime-wasi = "44.0.2"

[dev-dependencies]
async-trait = "0.1"
t3claw_dispatcher = { path = "../t3claw_dispatcher" }
t3claw_events = { path = "../t3claw_events" }
t3claw_extensions = { path = "../t3claw_extensions" }
t3claw_filesystem = { path = "../t3claw_filesystem" }
t3claw_resources = { path = "../t3claw_resources" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
wat = "1.245.1"
wit-component = "0.245.1"
wit-parser = "0.245.1"
