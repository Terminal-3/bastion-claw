[package]
name = "t3claw_product_adapters"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Product-adapter contracts for T3Claw Reborn (#3269)"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Terminal-3/t3-claw"
repository = "https://github.com/Terminal-3/t3-claw"
publish = false

[features]
default = []
# Compile in-memory test fakes (FakeProductWorkflow, FakeProtocolHttpEgress,
# FakeOutboundDeliverySink, FakeProjectionStream, etc.). Off by default so
# production binaries don't carry the fake state machinery; downstream
# crates enable it from `[dev-dependencies]`.
test-support = []
# Host runtimes enable this feature to mint verified protocol-auth evidence
# after they have performed real protocol verification. Adapter crates should
# not enable it.
host-auth-mint = []

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
t3claw_host_api = { path = "../t3claw_host_api", version = "0.1.0" }
t3claw_turns = { path = "../t3claw_turns", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync"] }
