[package]
name = "t3claw_product_workflow_storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Durable storage adapters for T3Claw Reborn product workflow"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Terminal-3/t3-claw"
repository = "https://github.com/Terminal-3/t3-claw"
publish = false

[features]
default = []
libsql = ["t3claw_filesystem/libsql"]
postgres = ["t3claw_filesystem/postgres"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
t3claw_filesystem = { path = "../t3claw_filesystem", version = "0.1.0" }
t3claw_host_api = { path = "../t3claw_host_api", version = "0.1.0" }
t3claw_product_workflow = { path = "../t3claw_product_workflow", version = "0.1.0" }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
deadpool-postgres = "0.14"
t3claw_filesystem = { path = "../t3claw_filesystem", features = ["libsql", "postgres"] }
t3claw_product_adapters = { path = "../t3claw_product_adapters" }
libsql = { version = "0.6", default-features = false, features = ["core", "replication", "remote", "tls"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-postgres = "0.7"
