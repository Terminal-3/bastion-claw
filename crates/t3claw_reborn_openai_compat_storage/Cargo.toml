[package]
name = "t3claw_reborn_openai_compat_storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Durable storage adapters for Reborn OpenAI-compatible refs"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Terminal-3/t3-claw"
repository = "https://github.com/Terminal-3/t3-claw"
publish = false

[features]
default = []
libsql = ["t3claw_filesystem/libsql"]
postgres = ["t3claw_filesystem/postgres"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock"] }
t3claw_filesystem = { path = "../t3claw_filesystem", version = "0.1.0" }
t3claw_host_api = { path = "../t3claw_host_api", version = "0.1.0" }
t3claw_reborn_openai_compat = { path = "../t3claw_reborn_openai_compat", version = "0.1.0" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"

[dev-dependencies]
t3claw_product_adapters = { path = "../t3claw_product_adapters", version = "0.1.0" }
t3claw_turns = { path = "../t3claw_turns", version = "0.1.0" }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
