[package]
name = "t3claw_product_adapter_registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "ProductAdapter host-api projection for T3Claw Reborn extension manifests"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Terminal-3/t3-claw"
repository = "https://github.com/Terminal-3/t3-claw"
publish = false

[dependencies]
t3claw_extensions = { path = "../t3claw_extensions", version = "0.1.0" }
t3claw_host_api = { path = "../t3claw_host_api", version = "0.1.0" }
t3claw_product_adapters = { path = "../t3claw_product_adapters", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
