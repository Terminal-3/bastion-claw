[package]
name = "t3claw_authorization"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
t3claw_filesystem = { path = "../t3claw_filesystem" }
t3claw_host_api = { path = "../t3claw_host_api" }
t3claw_trust = { path = "../t3claw_trust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
