[package]
name = "t3claw_first_party_extensions"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "First-party userland extension implementations for T3Claw"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Terminal-3/t3-claw"
repository = "https://github.com/Terminal-3/t3-claw"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22.1"
blake3 = "1"
futures-util = "0.3"
glob = "0.3"
t3claw_auth = { path = "../t3claw_auth" }
t3claw_filesystem = { path = "../t3claw_filesystem" }
t3claw_host_api = { path = "../t3claw_host_api" }
t3claw_safety = { path = "../t3claw_safety" }
t3claw_skills = { path = "../t3claw_skills" }
regex = "1"
serde_json = "1"
similar = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
