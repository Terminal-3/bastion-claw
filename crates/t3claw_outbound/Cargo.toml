[package]
name = "t3claw_outbound"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Outbound egress and projection subscription policy storage for T3Claw Reborn"
publish = false

[features]
default = []
libsql = ["dep:libsql"]
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres"]

[dependencies]
async-trait = "0.1"
deadpool-postgres = { version = "0.14", optional = true }
hex = "0.4"
t3claw_event_projections = { path = "../t3claw_event_projections" }
t3claw_filesystem = { path = "../t3claw_filesystem" }
t3claw_host_api = { path = "../t3claw_host_api" }
t3claw_turns = { path = "../t3claw_turns" }
libsql = { version = "0.6", optional = true, default-features = false, features = ["core", "replication", "remote", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio-postgres = { version = "0.7", optional = true }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
t3claw_events = { path = "../t3claw_events" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
