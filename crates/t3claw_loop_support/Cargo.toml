[package]
name = "t3claw_loop_support"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Loop support services for T3Claw Reborn AgentLoopHost implementations"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Terminal-3/t3-claw"
repository = "https://github.com/Terminal-3/t3-claw"
publish = false

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures = "0.3"
hex = "0.4.3"
jsonschema = { version = "0.45", default-features = false }
parking_lot = "0.12"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
t3claw_host_api = { path = "../t3claw_host_api", version = "0.1.0" }
t3claw_host_runtime = { path = "../t3claw_host_runtime", version = "0.1.0" }
t3claw_process_sandbox = { path = "../t3claw_process_sandbox", version = "0.1.0" }
t3claw_filesystem = { path = "../t3claw_filesystem", version = "0.1.0" }
t3claw_resources = { path = "../t3claw_resources", version = "0.1.0" }
t3claw_safety = { path = "../t3claw_safety", version = "0.2.2" }
t3claw_skills = { path = "../t3claw_skills", version = "0.3.0", default-features = false }
t3claw_memory = { path = "../t3claw_memory", version = "0.1.0" }
t3claw_threads = { path = "../t3claw_threads", version = "0.1.0" }
t3claw_turns = { path = "../t3claw_turns", version = "0.1.0" }
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
t3claw_trust = { path = "../t3claw_trust", version = "0.1.0" }
rust_decimal_macros = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
