[package]
name = "t3claw_agent_loop"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Agent-loop framework state and strategy contracts for T3Claw Reborn"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Terminal-3/t3-claw"
repository = "https://github.com/Terminal-3/t3-claw"
publish = false

[features]
default = []
test-support = []

[dependencies]
async-trait = "0.1"
blake3 = "1"
t3claw_common = { path = "../t3claw_common", version = "0.4.2" }
t3claw_host_api = { path = "../t3claw_host_api", version = "0.1.0" }
t3claw_turns = { path = "../t3claw_turns", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "time"] }
tracing = "0.1"

[dev-dependencies]
chrono = "0.4"
futures = "0.3"
t3claw_agent_loop = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt"] }
