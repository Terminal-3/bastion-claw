[package]
name = "t3claw_process_sandbox"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
t3claw_host_api = { path = "../t3claw_host_api" }
t3claw_processes = { path = "../t3claw_processes" }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
