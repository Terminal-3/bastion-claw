[package]
name = "t3claw_mcp"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
t3claw_extensions = { path = "../t3claw_extensions" }
t3claw_host_api = { path = "../t3claw_host_api" }
t3claw_resources = { path = "../t3claw_resources" }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
